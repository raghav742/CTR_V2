; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
; Serial console: 250000 baud (exact on the Mega), see docs/protocol.md
monitor_speed = 250000
monitor_echo = yes
monitor_eol = LF
lib_deps =
    teemuatlut/TMCStepper@0.7.3
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
; 256-byte serial send buffer (default 64) so replies never make the loop wait
build_flags = -DSERIAL_TX_BUFFER_SIZE=256

[env:v1]
build_flags = ${env.build_flags} -DHW_PROFILE_V1

[env:v2]
build_flags = ${env.build_flags} -DHW_PROFILE_V2
